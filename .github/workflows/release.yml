name: Release

# Pushing a tag such as v0.1.0 publishes polanon to PyPI and creates a GitHub release whose notes
# come from CHANGELOG.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  check:
    name: Tag, version and changelog agree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # PyPI never lets a version be replaced, only yanked: a tag that disagrees with the code, or a
      # release without its dated changelog entry, must stop here.
      - name: Compare
        run: |
          python - "${GITHUB_REF_NAME#v}" <<'PY'
          import re
          import sys
          from pathlib import Path

          tag = sys.argv[1]
          source = Path("polanon/__init__.py").read_text(encoding="utf-8")
          version = re.search(r'^__version__ = "([^"]+)"', source, re.MULTILINE).group(1)
          if version != tag:
              sys.exit(f"tag v{tag} does not match polanon {version}")
          changelog = Path("CHANGELOG.md").read_text(encoding="utf-8")
          if not re.search(rf"^## \[{re.escape(tag)}\]", changelog, re.MULTILINE):
              sys.exit(f"CHANGELOG.md has no '## [{tag}]' section")
          dated = rf"^## \[{re.escape(tag)}\] - \d{{4}}-\d{{2}}-\d{{2}}\s*$"
          if not re.search(dated, changelog, re.MULTILINE):
              sys.exit(f"CHANGELOG.md has no release date for {tag}: write '## [{tag}] - YYYY-MM-DD'")
          PY

  pypi:
    name: polanon to PyPI
    needs: check
    runs-on: ubuntu-latest
    # Trusted publishing: PyPI accepts the upload because it comes from this workflow in this
    # repository, so no API token is stored anywhere.
    environment:
      name: pypi
      url: https://pypi.org/project/polanon/
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build
        run: pip install build && python -m build

      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3

  github:
    name: GitHub release
    needs: pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Notes from the changelog
        run: |
          python - "${GITHUB_REF_NAME#v}" > notes.md <<'PY'
          import re
          import sys

          tag = sys.argv[1]
          changelog = open("CHANGELOG.md", encoding="utf-8").read()
          section = re.search(
              rf"^## \[{re.escape(tag)}\][^\n]*\n(.*?)(?=^## \[|\Z)", changelog, re.MULTILINE | re.DOTALL
          )
          print(section.group(1).strip())
          PY

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md --verify-tag
