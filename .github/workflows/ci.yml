name: CI

on:
  push:
    branches: [main]
  pull_request:

# Read-only by default: nothing here needs to write to the repository.
permissions:
  contents: read

# A new push to a pull request makes its previous run pointless. On main every commit keeps its
# run: a cancelled one shows as failing on the README's badge until the next run ends.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Lint, types and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # The provider SDKs are there for the recipes in examples/, which are tested against them
      # offline.
      - name: Install
        run: pip install -e ".[dev,ner,judge]" anthropic openai

      # `spacy download` is a pip install underneath, so the model lands in the pip cache that
      # setup-python already restores.
      - name: Download the spaCy model
        run: python -m spacy download pl_core_news_md

      - name: Lint
        run: ruff check --output-format=github . && ruff format --check .

      - name: Type-check
        run: mypy polanon

      - name: Test
        run: pytest --cov --cov-report=term-missing

      # Printed rather than asserted: tests/test_benchmark.py already holds the floors, and the
      # table is what a reviewer wants to see in the log when a guard changes.
      - name: Detection scores
        run: |
          python benchmarks/run.py --ner --markdown
          python benchmarks/run_agent.py --ner --markdown

  haystack:
    name: The Haystack components
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # The extra alone, without spaCy or the provider SDKs: the components must not need them.
      - name: Install
        run: pip install -e ".[dev,haystack]"

      # The main job reads Haystack as untyped, since it is not installed there.
      - name: Type-check with Haystack installed
        run: mypy polanon

      # The offline example runs here too; the paid one is only built, never run.
      - name: Test the components and the examples
        run: >-
          pytest tests/test_haystack.py tests/test_layering.py
          --cov --cov-config=tests/haystack.coveragerc --cov-report=term-missing

      # The extra allows haystack-ai 3.0, so the oldest release it allows is tested as well.
      - name: Test against the oldest Haystack allowed
        run: pip install "haystack-ai==3.0.0" && pytest tests/test_haystack.py -p no:cacheprovider

  gateway:
    name: The gateway
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      # The extra alone, without spaCy: the gateway masks with the rules when the model is absent.
      - name: Install
        run: pip install -e ".[dev,gateway]"

      - name: Type-check with the gateway's packages installed
        run: mypy polanon

      # test_gateway_server.py serves the gateway with uvicorn over real sockets, with and
      # without workers; the main job has no uvicorn and skips it.
      - name: Test the gateway, end to end
        run: pytest tests/test_gateway_payloads.py tests/test_gateway_app.py tests/test_gateway_cli.py tests/test_gateway_server.py tests/test_gateway_workers.py tests/test_layering.py

  # The command line reads files and pipes in Windows's code pages and UTF-16 and writes UTF-8 to
  # its console, which only Windows exercises; the rest of the suite runs there as well.
  windows:
    name: Tests on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -e ".[dev,ner,judge]" anthropic openai

      - name: Download the spaCy model
        run: python -m spacy download pl_core_news_md

      - name: Test
        run: pytest -p no:cacheprovider

  versions:
    name: The built wheel on Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Build and install the wheel with its extras
        run: |
          pip install build
          python -m build --wheel
          pip install "$(ls dist/polanon-*.whl)[ner,judge]" pytest pytest-asyncio httpx \
            anthropic openai
          python -m spacy download pl_core_news_md

      # The source tree is moved aside, so the tests import the installed wheel and nothing else.
      - name: Test the installed wheel
        run: mv polanon .polanon-source && python -m pytest -p no:cacheprovider

  package:
    name: Packages build, and the wheel works alone
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Build the wheel and the sdist
        run: |
          pip install build twine
          python -m build
          twine check --strict dist/*

      # What `pip install polanon` gets: no dependencies at all, and a command on the PATH. The
      # README promises the core runs on the standard library alone.
      - name: Install the wheel alone and mask a document
        working-directory: /tmp
        run: |
          python -m venv /tmp/bare
          /tmp/bare/bin/pip install "$GITHUB_WORKSPACE"/dist/polanon-*.whl
          masked="$(/tmp/bare/bin/polanon "Jan Kowalski, PESEL 50810112354")"
          echo "$masked"
          test "$masked" = "<OSOBA_1>, PESEL <PESEL_1>"
          # Without its extra the gateway's command says what to install, and starts nothing.
          if /tmp/bare/bin/polanon-gateway --upstream http://localhost:1/v1 2> hint.txt; then exit 1; fi
          grep -q 'polanon\[gateway\]' hint.txt

  docker:
    name: The gateway's image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      # Built for this machine and kept here: the release publishes the image, this only tries it.
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          tags: polanon-gateway:ci

      # Inside a container the gateway listens on every interface, so without a key it must refuse.
      - name: Refuse to start without a key
        run: |
          if docker run --rm polanon-gateway:ci --upstream http://127.0.0.1:9/v1 2> refusal.txt; then
            exit 1
          fi
          grep -q POLANON_GATEWAY_KEY refusal.txt

      - name: Mask a place with the model the image carries
        run: |
          docker run --rm --entrypoint python polanon-gateway:ci -c '
          from polanon import Anonymizer, default_guards
          masked = Anonymizer(default_guards()).anonymize_sync("Jan Kowalski mieszka w Gdańsku.")
          print(masked.anonymized)
          assert masked.anonymized == "<OSOBA_1> mieszka w <MIEJSCE_1>.", masked.anonymized
          '

      - name: Serve, report healthy, and refuse a call without the key
        run: |
          docker run -d --name gateway -p 127.0.0.1:8787:8787 -e POLANON_GATEWAY_KEY=ci-only-key \
            polanon-gateway:ci --upstream http://127.0.0.1:9/v1
          for attempt in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' gateway)" = healthy ] && break
            sleep 2
          done
          docker logs gateway
          test "$(docker inspect -f '{{.State.Health.Status}}' gateway)" = healthy
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/v1/chat/completions \
            -H 'content-type: application/json' -d '{"model": "m", "messages": [{"role": "user", "content": "Hej"}]}')"
          test "$status" = 401
          if docker logs gateway 2>&1 | grep -q ci-only-key; then exit 1; fi
          docker rm -f gateway

      # Two workers, each with the model, and the health check still answered. Nobody listens at
      # the upstream, so a call masked in a worker ends in 502; one that failed to mask is a 503.
      - name: Mask in two workers, report healthy
        run: |
          docker run -d --name workers -p 127.0.0.1:8788:8787 -e POLANON_GATEWAY_KEY=ci-only-key \
            polanon-gateway:ci --upstream http://127.0.0.1:9/v1 --workers 2
          for attempt in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' workers)" = healthy ] && break
            sleep 2
          done
          docker logs workers
          test "$(docker inspect -f '{{.State.Health.Status}}' workers)" = healthy
          docker logs workers 2>&1 | grep -q "masking in 2 processes"
          test "$(docker top workers | grep -c spawn_main)" = 2
          status="$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8788/v1/chat/completions \
            -H 'authorization: Bearer ci-only-key' -H 'content-type: application/json' \
            -d '{"model": "m", "messages": [{"role": "user", "content": "Jan Kowalski mieszka w Gdańsku."}]}')"
          test "$status" = 502
          docker rm -f workers
