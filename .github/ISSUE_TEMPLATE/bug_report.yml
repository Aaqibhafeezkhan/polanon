name: Bug
description: The library does something it should not.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste real personal data, or logs containing it, here.** This issue is public. If a
        value that had a token reached a provider or a log, report it privately from the Security
        tab instead.
  - type: textarea
    id: what
    attributes:
      label: What happened, and what you expected
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: How to reproduce it
      description: With invented data only.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version and how you run it
      placeholder: 0.1.0, Python 3.12, pip install "polanon[ner]" with pl_core_news_md
    validations:
      required: true
